<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Układanka z Mapą</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map {
      height: 400px;
      margin-bottom: 20px;
    }

    #puzzle-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    #puzzle-grid {
      width: 320px;
      height: 320px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 5px;
      border: 2px dashed #7f7fe9;
      margin-top: 20px;
    }

    .piece {
      width: 75px;
      height: 75px;
      cursor: grab;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <button id="getLocation">Pobierz lokalizację</button>
  <button id="saveMap">Zapisz mapę</button>
  <div id="raster-container"></div>
  <div id="puzzle-container">
    <div id="puzzle-grid"></div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="libs/leaflet-image.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
